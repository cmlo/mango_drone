# 將 simulator/ 部署到 GitHub Pages
# 首次使用前：Repo → Settings → Pages → Build and deployment → Source 選「GitHub Actions」
name: Deploy simulator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'simulator/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        working-directory: simulator
        run: npm test

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r simulator/index.html simulator/style.css simulator/src _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
